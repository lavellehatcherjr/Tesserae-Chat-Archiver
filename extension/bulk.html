<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8">
<title>Tesserae Chat Archiver — Back up everything</title>
<style>
  /* Same system as the popup: ink on paper, hairline rules, one colour. */
  :root {
    --paper:#ffffff; --paper-2:#f4f6f4; --rule:#e3e6e3; --rule-2:#c9cdc9;
    --ink:#141614; --ink-2:#555b56; --ink-3:#676d68;
    --accent:#1c5741; --accent-h:#164534; --on-accent:#ffffff;
    --danger:#8b2b2b; --ok:#1c5741; --focus:#1c5741;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper:#121412; --paper-2:#1a1d1a; --rule:#292d2a; --rule-2:#3b423d;
      --ink:#e9ece9; --ink-2:#a3aba5; --ink-3:#838c86;
      --accent:#7cc4a1; --accent-h:#96d3b5; --on-accent:#0e1a14;
      --danger:#e09090; --ok:#7cc4a1; --focus:#7cc4a1;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 56px 24px 72px; background: var(--paper); color: var(--ink);
    font: 15px/1.6 ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
  }
  main { max-width: 560px; margin: 0 auto; }
  h1 { margin: 0 0 6px; font-size: 26px; font-weight: 600; letter-spacing: -0.018em; }
  .sub { margin: 0 0 32px; color: var(--ink-2); font-size: 14.5px; max-width: 46em; }
  .lbl {
    display: block; margin-bottom: 10px;
    font-size: 10px; font-weight: 600; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--ink-3);
  }
  /* Sections are divided by a rule, not boxed in. The rule goes below each
     group: a legend notches a top border and chops the hairline in half. */
  fieldset { border: 0; padding: 0 0 22px; margin: 0 0 22px; border-bottom: 1px solid var(--rule); }
  fieldset:last-of-type { border-bottom: 0; margin-bottom: 0; padding-bottom: 0; }
  legend {
    padding: 0; margin-bottom: 10px;
    font-size: 10px; font-weight: 600; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--ink-3);
  }
  label { display: flex; align-items: baseline; gap: 10px; padding: 5px 0; cursor: pointer; }
  label span { color: var(--ink-2); }
  label b { color: var(--ink); font-weight: 600; }
  label:hover span, label:hover b { color: var(--ink); }
  input[type=radio], input[type=checkbox] { accent-color: var(--accent); margin: 0; width: 14px; height: 14px; }
  .names { margin: 0; font-size: 15px; font-weight: 600; color: var(--ink); }
  .note  { margin: 9px 0 0; font-size: 13px; line-height: 1.6; color: var(--ink-3); max-width: 52em; }
  button {
    padding: 11px 26px; font: inherit; font-size: 15px; font-weight: 600;
    color: var(--on-accent); background: var(--accent);
    border: 1px solid var(--accent); border-radius: 3px; cursor: pointer;
    transition: background 120ms ease, border-color 120ms ease, opacity 120ms ease;
  }
  button:hover:not(:disabled) { background: var(--accent-h); border-color: var(--accent-h); }
  button:disabled { opacity: .38; cursor: not-allowed; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .warn { margin: 16px 0 0; font-size: 13px; line-height: 1.6; color: var(--ink-3); max-width: 52em; }
  .warn b { color: var(--ink); font-weight: 600; }
  #banner:empty { display: none; }
  #banner {
    margin: 0 0 28px; padding: 12px 0 12px 14px;
    border-left: 2px solid var(--accent); font-size: 13.5px; color: var(--ink-2);
  }
  #progress { display: none; padding-top: 22px; border-top: 1px solid var(--rule); margin-top: 22px; }
  /* A 2px rule rather than a pill. Reads as a measure, not an ornament. */
  #track { height: 2px; background: var(--rule); }
  #bar { height: 100%; width: 0; background: var(--accent); transition: width 180ms ease; }
  #pct { display: block; margin-top: 9px; font-size: 11px; letter-spacing: 0.04em; color: var(--ink-3); }
  #log {
    margin-top: 16px; padding: 12px 14px; max-height: 320px; overflow-y: auto;
    background: var(--paper-2); border-left: 2px solid var(--rule-2);
    font: 12px/1.7 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
    color: var(--ink-2); white-space: pre-wrap; word-break: break-word;
  }
  #log:empty { display: none; }
  #log .ok  { color: var(--ok); font-weight: 600; }
  #log .err { color: var(--danger); font-weight: 600; }
  .langrow { margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--rule); text-align: right; }
  #lang { font: inherit; font-size: 12px; color: var(--ink-3); background: none; border: 0; padding: 0; cursor: pointer; }
  #lang:hover { color: var(--ink); }
</style>
</head>
<body>
<main>
  <h1 data-i18n="bulkTitle">Back up everything</h1>
  <p class="sub" data-i18n="bulkSub">Downloads every conversation in your account as one ZIP.</p>

  <div id="banner"></div>

  <fieldset>
    <legend data-i18n="account">Account</legend>
    <label><input type="radio" name="plat" value="claude" checked>
      <span><b>Claude</b> — claude.ai</span></label>
    <label><input type="radio" name="plat" value="chatgpt">
      <span><b>ChatGPT</b> — chatgpt.com</span></label>
  </fieldset>

  <fieldset>
    <legend data-i18n="oneAtATime">Supported, one chat at a time</legend>
    <p class="names">Gemini · Grok · DeepSeek · Copilot · Le Chat</p>
    <p class="note" id="note"></p>
  </fieldset>

  <fieldset>
    <legend data-i18n="saveEachAs">Save each chat as</legend>
    <label><input type="checkbox" id="fmt-md" checked> <span data-i18n="fmtMd">Markdown (.md)</span></label>
    <label><input type="checkbox" id="fmt-txt" checked> <span data-i18n="fmtTxt">Plain text (.txt)</span></label>
  </fieldset>

  <fieldset>
  <button id="go" data-i18n="startBackup">Start backup</button>

  <p class="warn"><b data-i18n="keepTabOpen">Keep this tab open.</b> <span data-i18n="keepTabOpenBody"></span></p>
  </fieldset>

  <div id="progress">
    <div id="track"><div id="bar"></div></div>
    <span id="pct"></span>
    <div id="log" role="status" aria-live="polite"></div>
  </div>
  <div class="langrow"><select id="lang"></select></div>
</main>

<script src="i18n.js"></script>
<script src="bulk.js"></script>
</body>
</html>
