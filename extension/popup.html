<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8">
<title>Tesserae Chat Archiver</title>
<style>
  /* Ink on paper: hairline rules instead of card boxes, hierarchy carried by
     type, and a single accent colour reserved for the primary action. */
  :root {
    --paper:    #ffffff;
    --paper-2:  #f4f6f4;   /* inset fills: log, diagnostics */
    --rule:     #e3e6e3;   /* hairline */
    --rule-2:   #c9cdc9;   /* hairline, emphasised */
    --ink:      #141614;   /* near-black, slightly green to sit with the accent */
    --ink-2:    #555b56;
    --ink-3:    #676d68;
    --accent:   #1c5741;   /* the only colour, and only on the primary action */
    --accent-h: #164534;
    --on-accent:#ffffff;
    --danger:   #8b2b2b;
    --ok:       #1c5741;
    --focus:    #1c5741;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper:    #121412;
      --paper-2:  #1a1d1a;
      --rule:     #292d2a;
      --rule-2:   #3b423d;
      --ink:      #e9ece9;
      --ink-2:    #a3aba5;
      --ink-3:    #838c86;
      --accent:   #7cc4a1;
      --accent-h: #96d3b5;
      --on-accent:#0e1a14;
      --danger:   #e09090;
      --ok:       #7cc4a1;
      --focus:    #7cc4a1;
    }
  }
  * { box-sizing: border-box; }
  body {
    width: 336px; margin: 0; padding: 16px 18px 14px;
    background: var(--paper); color: var(--ink);
    font: 13px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-variant-numeric: tabular-nums;          /* counts stay aligned as they climb */
    -webkit-font-smoothing: antialiased;
  }
  h1 {
    margin: 0 0 10px; font-size: 13px; font-weight: 600;
    letter-spacing: -0.006em; color: var(--ink);
  }
  /* Small caps label. Used for every section heading in both pages. */
  .lbl {
    font-size: 9.5px; font-weight: 600; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--ink-3);
  }
  .site {
    display: flex; align-items: baseline; gap: 8px;
    margin: 0 0 14px; padding-bottom: 12px; border-bottom: 1px solid var(--rule);
  }
  .site b { font-size: 13px; font-weight: 600; color: var(--ink); }

  fieldset { border: 0; padding: 0; margin: 0 0 14px; }
  legend { padding: 0; margin-bottom: 7px; }
  label {
    display: flex; align-items: center; gap: 8px;
    padding: 3px 0; cursor: pointer; color: var(--ink-2);
  }
  label:hover { color: var(--ink); }
  input[type=checkbox] { accent-color: var(--accent); margin: 0; width: 13px; height: 13px; }

  button {
    width: 100%; padding: 9px 14px; font: inherit; font-size: 13px; font-weight: 600;
    color: var(--on-accent); background: var(--accent);
    border: 1px solid var(--accent); border-radius: 3px; cursor: pointer;
    transition: background 120ms ease, border-color 120ms ease, opacity 120ms ease;
  }
  button:hover:not(:disabled) { background: var(--accent-h); border-color: var(--accent-h); }
  button:disabled { opacity: .38; cursor: not-allowed; }
  /* Secondary action, so not a second button. */
  button.secondary {
    width: auto; margin: 9px 0 0; padding: 2px 0;
    color: var(--ink-2); background: none; border: 0; border-radius: 0;
    font-weight: 500; font-size: 12px; text-align: left;
  }
  button.secondary::after { content: " \2192"; }
  button.secondary:hover { color: var(--ink); background: none; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .hint {
    margin: 14px 0 0; padding-top: 12px; border-top: 1px solid var(--rule);
    font-size: 11.5px; line-height: 1.55; color: var(--ink-3);
  }
  #log {
    margin-top: 12px; padding: 9px 11px; max-height: 164px; overflow-y: auto;
    background: var(--paper-2); border-left: 2px solid var(--rule-2); border-radius: 0;
    font: 11px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
    color: var(--ink-2); white-space: pre-wrap; word-break: break-word;
  }
  #log:empty { display: none; }
  #log .ok  { color: var(--ok); font-weight: 600; }
  #log .err { color: var(--danger); font-weight: 600; }

  .foot {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--rule);
  }
  #diag {
    visibility: hidden;              /* shown once there is something to report */
    font-size: 11px; color: var(--ink-3); cursor: pointer;
    border-bottom: 1px solid var(--rule-2); padding-bottom: 1px;
  }
  #diag:hover { color: var(--ink); }
  #diagbox {
    display: none; margin-top: 8px; padding: 8px 10px; max-height: 150px; overflow-y: auto;
    background: var(--paper-2); border-left: 2px solid var(--rule-2);
    font: 10px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: var(--ink-3); white-space: pre-wrap; word-break: break-word;
  }
  #lang {
    font: inherit; font-size: 11px; color: var(--ink-3);
    background: none; border: 0; padding: 0; cursor: pointer;
  }
  #lang:hover { color: var(--ink); }
</style>
</head>
<body>
  <h1>Tesserae Chat Archiver</h1>
  <p class="site"><span class="lbl" data-i18n="currentTab">Current tab:</span> <b id="platform" data-i18n="checking">checking…</b></p>

  <fieldset>
    <legend class="lbl" data-i18n="saveAs">Save as</legend>
    <label><input type="checkbox" id="fmt-md" checked> <span data-i18n="fmtMd">Markdown (.md)</span></label>
    <label><input type="checkbox" id="fmt-txt" checked> <span data-i18n="fmtTxt">Plain text (.txt)</span></label>
  </fieldset>

  <fieldset>
    <legend class="lbl" data-i18n="includeLegend">Include</legend>
    <label id="branches-row"><input type="checkbox" id="opt-branches">
      <span data-i18n="optBranches">Discarded replies (edited or regenerated)</span></label>
  </fieldset>

  <button id="go" data-i18n="exportChat">Export Chat</button>
  <button id="all" class="secondary" data-i18n="backupAll">Back up ALL chats…</button>

  <p class="hint" id="hint"></p>

  <div id="log" role="status" aria-live="polite"></div>
  <div id="diagwrap"><div id="diagbox"></div></div>

  <div class="foot">
    <span id="diag" role="button" tabindex="0" data-i18n="why">why?</span>
    <select id="lang"></select>
  </div>

  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
